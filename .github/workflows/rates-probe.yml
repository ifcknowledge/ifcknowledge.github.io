# TEMPORARY: runs the IBJA rates loader on GitHub's servers before it goes live.
# Runs only on the claude/ working branch. Will be removed before anything goes to main.
name: Rates probe

on:
  push:
    branches: [claude/trusting-pascal-h8hmhx]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build like the real publish does
        run: npm run build
        env:
          TZ: Asia/Kolkata
          SITE_URL: https://ifcknowledge.github.io
      - name: Show the gold box
        run: |
          echo "== saved rates =="; cat .cache/ibja-rates.json; echo
          echo "== gold box on the home page =="
          sed -n '/id="rates-title"/,/<\/section>/p' _site/index.html | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' ' '; echo
          grep -q 'id="rates-title"' _site/index.html
