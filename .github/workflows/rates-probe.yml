# TEMPORARY: looks at gold-rate sources from GitHub's servers so the rates loader can be written.
# Runs only on the claude/ working branch. Will be removed before anything goes to main.
name: Rates probe

on:
  push:
    branches: [claude/trusting-pascal-h8hmhx]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Probe sources
        run: |
          cat > probe.mjs <<'EOF'
          const UA = { "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36" };
          async function get(url) {
            try {
              const r = await fetch(url, { headers: UA, redirect: "follow", signal: AbortSignal.timeout(30000) });
              const t = await r.text();
              console.log(`\n===== ${url} -> ${r.status} ${r.url} ${t.length} chars, type ${r.headers.get("content-type")}`);
              return t;
            } catch (e) { console.log(`\n===== ${url} -> ERROR ${e.message}`); return ""; }
          }
          const show = (label, arr) => { console.log(`-- ${label} (${arr.length})`); for (const s of arr.slice(0, 40)) console.log("   " + s.replace(/\s+/g, " ").slice(0, 300)); };

          const html = await get("https://ibjarates.com/");
          const dec = (v) => v.replace(/&quot;/g, '"').replace(/&amp;/g, "&");
          for (const id of ["HdnGold", "HdnSilver", "HdnRatesAvaliable"]) {
            const m = html.match(new RegExp(`id="${id}" value="([^"]*)"`));
            console.log(`-- ${id}: ` + (m ? dec(m[1]).slice(0, 600) + " ... " + dec(m[1]).slice(-900) : "not found"));
          }
          const cut = (from, len) => { const i = html.indexOf(from); return i < 0 ? `(${from} not found)` : html.slice(i, i + len).replace(/\s+/g, " "); };
          console.log("-- today table:\n" + cut('id="TodayRatesTableDataYes"', 3500));
          console.log("-- previous dates:\n" + cut("Previous Dates Rate", 5000));
          console.log("-- dates on page: " + [...new Set(html.match(/\b\d{2}[\/-]\d{2}[\/-]20\d{2}\b/g) || [])].slice(-12).join(", "));
          EOF
          node probe.mjs
