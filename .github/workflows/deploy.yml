# Builds the website and publishes it on GitHub Pages — free.
# Runs when:
#   • you save a story in the admin panel (every save is a commit to the main branch),
#   • every 3 hours (new YouTube videos become stories, gold rates update, scheduled stories go live),
#   • you click "Run workflow" on the Actions tab.
name: Publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write # saves the stories made from new YouTube videos
  pages: write
  id-token: write

# Only one publish at a time. A newer save waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v6

      - name: Install
        run: npm ci

      # Each new video on the YouTube channel becomes a story (scripts/youtube-to-news.mjs).
      # A problem with YouTube never stops the website from being published.
      # With the GEMINI_API_KEY secret, Gemini writes each story from what is said in the video.
      - name: Turn new YouTube videos into stories
        continue-on-error: true
        timeout-minutes: 45
        run: node scripts/youtube-to-news.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save the new stories
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain -- src/news data)" ]; then
            git config user.name "IFC knowledge bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- src/news data
            git commit -q -m "News from new YouTube videos"
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
          fi

      # Keeps the last good YouTube video list, in case YouTube's feed is down during a build.
      - name: Restore saved data
        uses: actions/cache@v6
        with:
          path: .cache
          key: site-cache-${{ github.run_id }}
          restore-keys: site-cache-

      - name: Build the website
        run: npm run build
        env:
          TZ: Asia/Kolkata
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}
          CMS_REPO: ${{ github.repository }}
          CMS_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}

      - name: Upload the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
