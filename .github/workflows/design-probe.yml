# TEMPORARY: deletes the temporary screenshot ref refs/tmp/design-shots left by the design probe.
# Runs only on the claude/ working branch. Will be removed before anything goes to main.
name: Design probe cleanup

on:
  push:
    branches: [claude/trusting-pascal-h8hmhx]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the temporary screenshot ref
        run: |
          git init -q .
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete refs/tmp/design-shots || echo "already gone"
