# TEMPORARY: checks that Google Translate's page translation works for the live site (English switch).
# Runs only on the claude/ working branch. Will be removed before anything goes to main.
name: Language probe

on:
  push:
    branches: [claude/trusting-pascal-h8hmhx]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install browser
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-save playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Open the translated site
        working-directory: /tmp/pw
        run: |
          cat > probe.cjs <<'EOF'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1280, height: 900 } });
            const url = "https://ifcknowledge-github-io.translate.goog/?_x_tr_sl=hi&_x_tr_tl=en&_x_tr_hl=en&_x_tr_pto=wapp";
            const r = await p.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
            console.log("status", r && r.status(), "final url", p.url());
            await p.waitForTimeout(9000);
            const text = await p.evaluate(() => document.body.innerText.replace(/\s+/g, " ").slice(0, 900));
            console.log("TEXT:", text);
            const link = await p.evaluate(() => [...document.querySelectorAll(".main-nav a, .site-nav a")].slice(0, 4).map(a => a.href).join(" | "));
            console.log("LINKS:", link);
            await b.close();
          })();
          EOF
          node probe.cjs
